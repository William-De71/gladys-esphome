name: Feature request
description: Something the integration could do for you.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The use case first (a scene, a dashboard, a sensor…), then the idea. Add the YAML of the ESPHome entity concerned if there is one.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Gladys, integration and ESPHome versions
      placeholder: 'Gladys 5.1.4, integration 1.2.0, ESPHome 2026.9.0'
